name: Kotlin CI

on:
  push:
    branches: [kotlin]
  pull_request:
    branches: [main, kotlin]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all modules and run tests
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  package-windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build MSI
        run: .\gradlew.bat :app:packageMsi --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SnapSeek-windows-msi
          path: app/build/compose/binaries/main/msi/*.msi
